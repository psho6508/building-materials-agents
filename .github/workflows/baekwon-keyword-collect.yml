name: 백원철물건재 키워드 수집 (하루 4회)

on:
  schedule:
    # UTC 22,3,8,12 = KST 07:00 / 12:00 / 17:00 / 21:00. 예약 실행은 몇 분~10여 분 늦게 시작될 수 있습니다.
    - cron: "0 22,3,8,12 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: baekwon_keyword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: baekwon_keyword/requirements.txt
      - run: pip install -r requirements.txt
      - name: 키워드 수집 및 텔레그램 발송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python collect_and_notify.py
      - name: 상태 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state keyword_storage
          git diff --cached --quiet || git commit -m "chore: 키워드 후보 상태 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
