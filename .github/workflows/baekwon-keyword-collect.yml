name: 백원철물건재 키워드 수집 (하루 4회)

on:
  schedule:
    # UTC 22,3,8,12 = KST 07:00 / 12:00 / 17:00 / 21:00. 예약 실행은 몇 분~10여 분 늦게 시작될 수 있습니다.
    - cron: "0 22,3,8,12 * * *"
  workflow_dispatch:
    inputs:
      test_candidate_topic:
        description: "비워두면 평소대로 수집. 값을 넣으면 그 주제로 테스트 카드 1건만 강제 발송 (버튼 동작 확인용)"
        required: false
        default: ""
      raw_message:
        description: "값을 넣으면 수집을 건너뛰고 이 텍스트를 그대로 텔레그램으로 발송 (다른 작업 결과 보고용)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: baekwon_keyword
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: baekwon_keyword/requirements.txt
      - run: pip install -r requirements.txt
      - name: 키워드 수집 및 텔레그램 발송
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEST_CANDIDATE_TOPIC: ${{ github.event.inputs.test_candidate_topic }}
          RAW_MESSAGE_TEXT: ${{ github.event.inputs.raw_message }}
        run: python collect_and_notify.py
      - name: 상태 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state keyword_storage
          git diff --cached --quiet || git commit -m "chore: 키워드 후보 상태 갱신 ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          git pull --rebase origin "${{ github.ref_name }}"
          git push
